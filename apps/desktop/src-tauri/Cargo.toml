[package]
name = "anycode-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"

[lib]
name = "anycode_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync"] }
anycode-store = { path = "../../../crates/anycode-store" }
anycode-fs = { path = "../../../crates/anycode-fs" }
anycode-git = { path = "../../../crates/anycode-git" }
anycode-terminal = { path = "../../../crates/anycode-terminal" }
anycode-models = { path = "../../../crates/anycode-models" }
anycode-secrets = { path = "../../../crates/anycode-secrets" }
anycode-security = { path = "../../../crates/anycode-security" }
anycode-tools = { path = "../../../crates/anycode-tools" }
anycode-agent = { path = "../../../crates/anycode-agent" }
anycode-core = { path = "../../../crates/anycode-core" }

[dev-dependencies]
# The mock runtime drives the real agent loop without a webview (src/agent_live_test.rs).
tauri = { version = "2", features = ["test"] }

# Standalone workspace: this crate is driven by the pnpm/Tauri toolchain, not `cargo test
# --workspace` at the repo root, so it does not join crates/*'s workspace.
[workspace]
