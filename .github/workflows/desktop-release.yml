name: Desktop Release

# Builds native installers for Windows, macOS, and Linux (PRD §93, docs/ROADMAP.md
# "Distribution gate"). Runs on demand or on a version tag so it doesn't slow down every
# push — installer builds are expensive; the fast `ci.yml` already validates every commit.
#
# Mobile (iOS/Android) is deliberately not here: there is no mobile application target to
# package yet — that's Phase 10 (docs/ROADMAP.md). A CI job with nothing real to build
# would be exactly the fake-artifact problem docs/ENGINEERING-STANDARDS.md forbids.
#
# Signing is opportunistic: cargo-tauri produces a valid unsigned build when the signing
# secrets below are unset, and a signed + notarized one the moment they're added in
# Settings -> Secrets. No workflow change is needed when certificates arrive later —
# only the secrets themselves. See docs/RELEASING.md for what each secret is and how to
# generate it.

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch: {}

jobs:
  build:
    # tauri-action creates (or updates) the draft release and uploads the installers to
    # it. The repository's default token is read-only, so without this every platform
    # built successfully and then failed at "create a release" — the first run did.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest runners are Apple Silicon, so a default build is arm64-only and
          # will not start on an Intel Mac. A universal binary runs on both.
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # An unset secret reaches a step as an empty string, and Tauri treats a *defined*
      # APPLE_CERTIFICATE as "sign with this" — so an unconfigured repository failed the
      # macOS build at certificate import instead of producing the unsigned build this
      # workflow promises. Only credentials that actually have a value are exported.
      - name: Export signing credentials that are configured
        shell: bash
        env:
          # macOS code signing + notarization. Unset today: build is unsigned and ad hoc.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows code signing. Unset today: build is unsigned.
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Tauri updater artifact signature (PRD §93 auto-update). Unset until the
          # updater plugin itself is implemented — a later phase, not a cert problem.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                      APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID \
                      WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD \
                      TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            value="${!name}"
            if [ -n "$value" ]; then
              # Heredoc form: certificates are multi-line. Values stay masked in logs.
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; echo "$value"; echo "$delimiter"; } >> "$GITHUB_ENV"
              echo "$name: configured"
            else
              echo "$name: not configured"
            fi
          done

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: app-v__VERSION__
          releaseName: "Any Code v__VERSION__"
          releaseBody: "Unsigned build until release certificates are configured — see docs/RELEASING.md."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
