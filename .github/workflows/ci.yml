name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Reject committed .env files
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Environment files must never be committed:"
            echo "$leaked"
            exit 1
          fi
          echo "Clean."

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # anycode-secrets uses the Secret Service on Linux, which links libdbus.
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo test --workspace --all-features

  desktop-runtime:
    name: Desktop runtime (format, lint, test)
    # The agent loop and permission gate live in apps/desktop/src-tauri, which is its own
    # cargo workspace — nothing in the jobs above reaches it. macOS needs no extra system
    # packages to compile Tauri.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # tauri::generate_context! embeds the built frontend, so it must exist to compile.
      - run: pnpm --filter @anycode/desktop build
      - working-directory: apps/desktop/src-tauri
        run: cargo fmt --check
      - working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets --all-features
      # The live agent test is #[ignore]d: it needs a local model, which CI does not have.
      - working-directory: apps/desktop/src-tauri
        run: cargo test --lib

  desktop-frontend:
    name: Desktop frontend (build, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @anycode/desktop build
      - run: pnpm --filter @anycode/desktop test
