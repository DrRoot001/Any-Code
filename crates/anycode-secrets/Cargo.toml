[package]
name = "anycode-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thiserror = { workspace = true }
# keyring 3 has no default store: with no platform feature enabled it silently falls
# back to an in-memory mock, and every saved key is lost the moment it is written.
# That is what this crate shipped with until 2026-09-24. Each target names its real store.
keyring = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
